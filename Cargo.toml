[package]
name = "cosmic-applet-startmenu"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A COSMIC panel applet with a classic Windows-7-style start menu"
repository = "https://github.com/MyNameIs-13/cosmic-applet-startmenu"

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10"
rust-embed = "8.11"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
async-trait = "0.1"
zbus = { version = "5.14", default-features = false, features = ["tokio"] }
freedesktop-icons = "0.4"
freedesktop-desktop-entry = "0.8"

[dev-dependencies]
futures = "0.3"

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
    # Applet support (pulls in wayland + winit, which applets need)
    "applet",
    "applet-token",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Detached process spawning (`cosmic::process::spawn`)
    "process",
]

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
